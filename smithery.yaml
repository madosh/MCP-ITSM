# Smithery configuration — https://smithery.ai/docs/build/publish
# MCP ITSM Server v3.0.0 | spec 2025-11-25 | SDK ^1.28.0

build:
  dockerBuildPath: .

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - apiKey
    properties:
      apiKey:
        type: string
        description: API key for the ITSM integration service.
  commandFunction:
    |-
    (config) => ({ command: 'npm', args: ['start'], env: { API_KEY: config.apiKey } })

# Tools, resources, and prompts are served by the MCP server at runtime.
# tools.json provides static metadata for Smithery's tree-based browser.
tools:
  path: ./tools.json
